name: Feature request
description: Suggest a feature or usability improvement for windowinsets.info.
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem this feature would solve and how it would help people inspect Android insets.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain what is currently difficult or impossible to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the behavior and user flow you would like.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Related areas
      multiple: true
      options:
        - Inset data and units
        - Device diagrams and animations
        - Search and device navigation
        - JSON export or developer workflows
        - Accessibility and responsive UI
        - Measurement and verification
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Describe any workaround you are using.
  - type: textarea
    id: context
    attributes:
      label: Supporting material
      description: Attach example screenshots, links, sketches, or other relevant material.
