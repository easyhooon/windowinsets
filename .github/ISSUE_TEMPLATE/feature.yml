name: 기능 제안
description: windowinsets.info에 필요한 기능이나 사용성 개선을 제안해 주세요.
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        제안하려는 기능이 해결할 문제와 Android 인셋 확인에 어떤 도움이 되는지 알려주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 작업이 어렵거나 불가능한지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 원하는 동작과 화면 흐름을 구체적으로 설명해 주세요.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 관련 영역
      multiple: true
      options:
        - 인셋 데이터와 단위
        - 기기 다이어그램과 애니메이션
        - 검색과 기기 탐색
        - JSON 내보내기 또는 개발자 활용
        - 접근성과 반응형 UI
        - 측정·검증 절차
        - 기타
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 현재 사용 중인 대안
      description: 우회 방법이 있다면 알려주세요.
  - type: textarea
    id: context
    attributes:
      label: 참고 자료
      description: 예시 화면, 링크, 스케치 등이 있으면 첨부해 주세요.
