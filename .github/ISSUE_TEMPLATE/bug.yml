name: Bug report
description: Report a problem with the interface, data, or interactions.
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Include only the information needed to reproduce it. Do not share account details, device identifiers, or other sensitive information.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Inset values or units (dp/px)
        - Device diagram or animation
        - Device, display, or navigation mode selection
        - JSON export
        - Mobile or desktop layout
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device checked
      description: Enter the model and display selected on the site (Main/Cover).
      placeholder: e.g., Galaxy Z Flip8 · Cover
    validations:
      required: true
  - type: dropdown
    id: navigation-mode
    attributes:
      label: Navigation mode
      options:
        - Gesture
        - 3-button
        - Not applicable or unknown
    validations:
      required: true
  - type: input
    id: fold-state
    attributes:
      label: Fold state or screen orientation
      description: If relevant, describe whether the device is folded, partially folded, or unfolded, and whether the screen is in portrait or landscape.
      placeholder: e.g., Fully unfolded · landscape
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps in order so we can reproduce the problem.
      placeholder: |
        1. Select Galaxy Z Flip8.
        2. Select Cover and Gesture mode.
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the displayed value or error message as accurately as possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or exported JSON
      description: Drag and drop files here if needed. Remove any sensitive information first.
