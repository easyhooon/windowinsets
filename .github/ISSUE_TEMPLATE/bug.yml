name: 버그 신고
description: 화면, 데이터, 조작 과정에서 발견한 문제를 알려주세요.
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 재현에 필요한 정보만 작성해 주세요. 계정이나 기기 식별 정보 등 민감한 정보는 첨부하지 마세요.
  - type: dropdown
    id: area
    attributes:
      label: 문제가 발생한 영역
      options:
        - 인셋 값 또는 단위(dp/px)
        - 기기 다이어그램 또는 애니메이션
        - 기기·화면·내비게이션 모드 선택
        - JSON 내보내기
        - 모바일 또는 데스크톱 레이아웃
        - 기타
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 확인한 기기
      description: 사이트에서 선택한 모델과 화면(Main/Cover)을 적어주세요.
      placeholder: 예) Galaxy Z Flip8 · Cover
    validations:
      required: true
  - type: dropdown
    id: navigation-mode
    attributes:
      label: 내비게이션 모드
      options:
        - 제스처
        - 3버튼
        - 해당 없음 또는 알 수 없음
    validations:
      required: true
  - type: input
    id: fold-state
    attributes:
      label: 폴드 상태 또는 화면 방향
      description: 접힘·부분 접힘·펼침 상태나 세로·가로 방향이 관련된 경우 적어주세요.
      placeholder: 예) 완전히 펼친 상태 · 가로
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제가 다시 나타나도록 순서대로 적어주세요.
      placeholder: |
        1. Galaxy Z Flip8을 선택합니다.
        2. Cover와 제스처 모드를 선택합니다.
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 표시된 값이나 오류 문구를 가능한 한 정확히 적어주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 스크린샷 또는 내보낸 JSON
      description: 필요한 경우 파일을 끌어다 놓아 첨부해 주세요. 민감한 정보는 먼저 제거해 주세요.
