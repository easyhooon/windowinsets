name: Form factor, manufacturer, or device request
description: Request support or measurements for a new form factor, manufacturer, or device.
title: "[Device Request] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        We review requests against official specifications, emulator skins, and measurement availability. We do not estimate inset values that have not been measured.
  - type: dropdown
    id: request-type
    attributes:
      label: Request scope
      options:
        - Specific device from an existing manufacturer
        - New manufacturer
        - New form factor
    validations:
      required: true
  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
      placeholder: e.g., Samsung
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device name or product family
      placeholder: e.g., Galaxy Z Fold7
    validations:
      required: true
  - type: dropdown
    id: form-factor
    attributes:
      label: Form factor
      options:
        - Smartphone (bar)
        - Book-style foldable (Fold)
        - Clamshell foldable (Flip)
        - Tablet
        - Dual-screen or other
    validations:
      required: true
  - type: input
    id: release-year
    attributes:
      label: Release year
      placeholder: e.g., 2025
  - type: textarea
    id: screens
    attributes:
      label: Displays and states needed
      description: List the displays and states to cover, such as Main/Cover, folded/unfolded, or portrait/landscape.
      placeholder: e.g., Cover and unfolded inner displays, in both Gesture and 3-button modes
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Official sources
      description: Add links to manufacturer product pages, official resolution specifications, emulator skins, or other official material.
  - type: dropdown
    id: measurement-access
    attributes:
      label: Measurement availability
      options:
        - I can provide a device or capture measurements
        - Available in a remote test lab
        - I do not know how it can be measured
  - type: textarea
    id: reason
    attributes:
      label: Why is this support needed?
      description: Share the development or verification problem and any context that would help assess its priority.
    validations:
      required: true
