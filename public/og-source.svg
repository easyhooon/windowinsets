<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e293b" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left: title -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">windowinsets.info</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">Window insets for Samsung Galaxy devices</text>

  <text x="80" y="340" font-family="Arial, sans-serif" font-size="18" fill="#4ade80" font-weight="700">■ Safe Area</text>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="18" fill="#fb923c" font-weight="700">■ Insets (bars + cutout)</text>
  <text x="80" y="410" font-family="Arial, sans-serif" font-size="18" fill="#f472b6" font-weight="700">■ Corner Radius</text>

  <text x="80" y="480" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Every value labeled official, measured, or community —</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="20" fill="#64748b">with a source for every number.</text>

  <!-- Right: device diagram -->
  <g transform="translate(820, 65)">
    <rect x="0" y="0" width="260" height="500" rx="36" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    <rect x="20" y="20" width="220" height="460" fill="#4ade80" fill-opacity="0.4"/>
    <rect x="20" y="20" width="220" height="55" fill="#fb923c" fill-opacity="0.6"/>
    <rect x="20" y="425" width="220" height="55" fill="#fb923c" fill-opacity="0.6"/>
    <rect x="112" y="30" width="36" height="18" rx="9" fill="#0f172a"/>
    <circle cx="20" cy="20" r="9" fill="#f472b6"/>
    <circle cx="240" cy="20" r="9" fill="#f472b6"/>
    <circle cx="20" cy="480" r="9" fill="#f472b6"/>
    <circle cx="240" cy="480" r="9" fill="#f472b6"/>
  </g>
</svg>
